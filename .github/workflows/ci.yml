name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets-scan:
    uses: abhiman-erla/ci-templates/.github/workflows/secret-scan.yml@11abec65f0c86a0f95e32250f9656c4cbd628b1f # v1.2.0

  workflow-lint:
    uses: abhiman-erla/ci-templates/.github/workflows/workflow-lint.yml@11abec65f0c86a0f95e32250f9656c4cbd628b1f # v1.2.0

  python:
    # ruff check, ruff format --check, mypy, pytest with coverage: the same four
    # gates as before, run through uv with the lockfile.
    uses: abhiman-erla/ci-templates/.github/workflows/python-ci.yml@11abec65f0c86a0f95e32250f9656c4cbd628b1f # v1.2.0
    permissions:
      contents: read
    with:
      # Matches .python-version (3.13); requires-python is >=3.12,<3.14.
      python-version: "3.13"
      mypy-path: src
      pytest-args: --cov=src --cov-report=term-missing

  ci-ok:
    if: always()
    needs: [secrets-scan, workflow-lint, python]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
