[project]
name = "default-risk-pipeline"
version = "0.1.0"
description = "End-to-end default-risk ML system: tracked training, served model, drift monitoring, CI retraining."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "mlflow>=2.16,<3",
    "pandera>=0.20",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pipeline = [
    "dvc>=3.50",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
drp = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PD", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "mlflow.*", "pandera.*", "sklearn.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:mlflow.*"]
